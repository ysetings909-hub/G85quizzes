const Q=[0,1,2,3,4].map(k=>{const r=rng(k+7),a=[].concat(...T.map(t=>t.slice(4*k,4*k+4)));for(let i=a.length-1;i>0;i--){const j=Math.floor(r()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a});
const PR=["Awesome!","Brilliant!","Nailed it!","Super smart!","Well done!"],PE=["🌟","🎯","💥","🧠","👏"],WR=["Not quite!","Good try!","So close!","Learning moment!"];
const $=s=>document.querySelector(s),app=$('#app');
let S=load(),view='home',qi=0,msg=null,fs=false,lock=0;
function load(){try{const s=JSON.parse(localStorage.getItem('mq6'));if(s&&s.p)return s}catch(e){}return{p:[null,null,null,null,null],b:[-1,-1,-1,-1,-1],c:null}}
function save(){try{localStorage.setItem('mq6',JSON.stringify(S))}catch(e){}}
const pts=i=>5*Math.max(S.b[i],S.p[i]?S.p[i].s:0,0),total=()=>[0,1,2,3,4].reduce((a,i)=>a+pts(i),0);
const shuf=a=>{for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const stars=s=>s>=18?5:s>=15?4:s>=12?3:s>=8?2:1,LB=['','Bad','Not good','Good','Very good!','Excellent!'],RE=['','📖','💪','👍','🎉','🏆'];
const MS=['','Keep studying — you can do better next time!','Getting there. Review the lesson and try again!','Nice work, a few more to master.','Great job — almost perfect!','Outstanding! You really know your matter.'];
const sg=n=>'⭐'.repeat(n)+'☆'.repeat(5-n);
document.addEventListener('pointerdown',()=>{if(fs)return;fs=true;try{const e=document.documentElement;(e.requestFullscreen||e.webkitRequestFullscreen||(()=>0)).call(e)}catch(x){}},{once:true});
const gv=i=>`--g:linear-gradient(135deg,${G[i][0]},${G[i][1]})`;
function home(){
 view='home';const t=total(),C=2*Math.PI*78,done=S.b.filter(x=>x>=0).length,c=S.c,p=c!==null&&S.p[c];
 const res=p&&!p.fin&&(p.n>0||p.a[0]>=0);
 app.innerHTML=`<div class="w"><div class="hero"><div><h1>Matter Quiz</h1><p>Science review</p></div><div class="em" style="margin-left:auto">🔬</div></div>
 <div class="ringbox"><div class="ring"><svg viewBox="0 0 190 190"><defs><linearGradient id="rg"><stop offset="0" stop-color="#6366f1"/><stop offset=".5" stop-color="#ec4899"/><stop offset="1" stop-color="#a855f7"/></linearGradient></defs><circle cx="95" cy="95" r="78" fill="none" stroke="#e3e7f6" stroke-width="16"/><circle class="fg" id="fg" cx="95" cy="95" r="78" fill="none" stroke="url(#rg)" stroke-width="16" stroke-linecap="round" stroke-dasharray="${C}" stroke-dashoffset="${C}"/></svg><div class="c"><b>${t}</b><span>/500</span></div></div></div>
 <div class="chips"><span class="chip">5 quizzes</span><span class="chip">20 questions each</span><span class="chip">✅ ${done}/5 done</span></div>
 ${res?`<div class="resume"><p>Continue Quiz ${c+1} · Question ${Math.min(p.n+1+(p.a[p.n]>=0?1:0),20)} of 20</p><div class="row"><button class="btn" data-r="1">Resume</button><button class="btn o" data-so="1">Start over</button></div></div>`:''}
 ${N.map((n,i)=>{const b=S.b[i];return`<button class="qc" style="${gv(i)}" data-q="${i}"><div class="tile">${IC[i]}</div><div class="t"><b>${n}</b><small>20 questions</small></div><div class="bs">${b>=0?`<i>${'⭐'.repeat(stars(b))}</i>${b}/20`:'Not tried'}</div><span class="ar">›</span></button>`}).join('')}
 <div class="foot"><button data-reset="1">Reset all progress</button></div></div>`;
 requestAnimationFrame(()=>requestAnimationFrame(()=>{const f=$('#fg');if(f)f.style.strokeDashoffset=C*(1-t/500)}));
 app.onclick=e=>{const b=e.target.closest('button');if(!b)return;
  if(b.dataset.q!==undefined)start(+b.dataset.q);
  else if(b.dataset.r)start(c,true);
  else if(b.dataset.so){S.p[c]=null;S.c=null;save();home()}
  else if(b.dataset.reset)modal()}
}
function modal(){const m=document.createElement('div');m.className='mod';m.innerHTML='<div role="dialog" aria-label="Confirm reset"><p>Reset all progress? Points, stars and streaks will be cleared.</p><div class="row"><button class="btn o" id="mn">Cancel</button><button class="btn" id="my" style="background:#dc2626">Reset</button></div></div>';document.body.appendChild(m);
 m.querySelector('#mn').onclick=()=>m.remove();m.querySelector('#my').onclick=()=>{S={p:[null,null,null,null,null],b:[-1,-1,-1,-1,-1],c:null};save();m.remove();home()}}
function start(i,resume){qi=i;S.c=i;let p=S.p[i];if(p&&!p.fin&&p.a[p.n]>=0){if(p.n<19)p.n++;else{rate();return}}
 if(!p||p.fin||!resume&&false){}
 if(!p||p.fin){p=S.p[i]={n:0,o:Array.from({length:20},()=>shuf([0,1,2])),a:Array(20).fill(-1),s:0,k:0,fin:false}}
 msg=null;save();quiz()}
function quiz(){
 view='quiz';lock=Date.now()+450;const i=qi,p=S.p[i],n=p.n,q=Q[i][n],o=p.o[n],a=p.a[n],ans=a>=0;
 let h=`<div class="w" style="${gv(i)}"><div class="top"><button class="pill" data-h="1">← Quizzes</button><div class="sp"><div class="pill" aria-live="polite">${p.s*5}<br>/100</div><div class="pill tot">${total()}/500<br>total</div></div></div>
 <div class="pb" role="progressbar" aria-valuemin="0" aria-valuemax="20" aria-valuenow="${n+(ans?1:0)}"><div style="width:${(n+(ans?1:0))/20*100}%"></div></div>
 <div class="card"><div class="meta"><span class="glass">${IC[i]} ${N[i]}</span><span class="glass">${n+1}/20</span></div><h2>${q[0]}</h2></div>`;
 o.forEach((k,j)=>{let c='',m='';if(ans){if(k===0){c=' ok';m='✓'}else if(j===a){c=' no';m='✕'}else c=' fade'}
  h+=`<button class="ans${c}" data-a="${j}" ${ans?'disabled':''}><span class="L L${j}">${'ABC'[j]}</span><span>${q[1+k]}</span><span class="mk">${m}</span>${ans&&j===a&&k===0?'<span class="fp">+5 ⭐</span>':''}</button>`});
 if(ans){const ok=o[a]===0;if(!msg)msg=ok?`${PE[Math.random()*5|0]} ${PR[Math.random()*5|0]}`:`${WR[Math.random()*4|0]} The answer is: ${q[1]}`;
  if(ok)h+=`<div class="ban g" role="status">${msg}</div>`;
  if(ok&&p.k>=3)h+=`<div class="ban f">🔥 ${p.k} in a row!</div>`;
  if(!ok)h+=`<button class="next" data-n="1">${n===19?'See my rating':'Next →'}</button>`}
 app.innerHTML=h+'</div>';
 app.onclick=e=>{const b=e.target.closest('button');if(!b)return;
  if(b.dataset.h)home();
  else if(b.dataset.a!==undefined&&!ans){if(Date.now()<lock)return;const j=+b.dataset.a;p.a[n]=j;if(p.o[n][j]===0){p.s++;p.k++}else p.k=0;
   msg=null;save();quiz();if(p.o[n][j]===0)setTimeout(()=>{if(view==='quiz'&&qi===i&&S.p[i]===p&&p.n===n){msg=null;if(n===19)rate();else{p.n++;save();quiz()}}},1300)}
  else if(b.dataset.n){msg=null;if(n===19)rate();else{p.n++;save();quiz()}}}
}
function rate(){
 view='rate';const i=qi,p=S.p[i],s=p.s,st=stars(s);p.fin=true;if(s>S.b[i])S.b[i]=s;save();
 const C=2*Math.PI*60,R=[null,['#ef4444','#f97316'],['#f97316','#f59e0b'],['#3b82f6','#06b6d4'],['#22c55e','#84cc16'],['#a855f7','#ec4899']][st];
 app.innerHTML=`<div class="w" style="--g:linear-gradient(135deg,${R[0]},${R[1]})"><div class="rate"><div class="re">${RE[st]}</div><div class="rtag">${IC[i]} ${N[i]}</div><div class="ring" style="width:190px;height:190px;margin:8px auto"><svg viewBox="0 0 150 150"><defs><linearGradient id="r2"><stop offset="0" stop-color="${R[0]}"/><stop offset="1" stop-color="${R[1]}"/></linearGradient></defs><circle cx="75" cy="75" r="60" fill="none" stroke="#e3e7f6" stroke-width="14"/><circle class="fg" id="f2" cx="75" cy="75" r="60" fill="none" stroke="url(#r2)" stroke-width="14" stroke-linecap="round" stroke-dasharray="${C}" stroke-dashoffset="${C}"/></svg><div class="c"><b>${s}</b><span>out of 20</span></div></div>
 <div class="stars" aria-label="${st} of 5 stars">${[1,2,3,4,5].map(k=>`<i class="${k<=st?'on':''}" style="animation-delay:${.5+k*.12}s">★</i>`).join('')}</div><h2>${LB[st]}</h2><p>${MS[st]}</p><div class="stats"><div><b>${s}</b><small>Correct</small></div><div><b>${20-s}</b><small>Missed</small></div><div><b>${s*5}</b><small>Points</small></div></div>
 <div class="row"><button class="btn" data-t="1" style="background:var(--g)">Try again</button><button class="btn o" data-h="1">All quizzes</button></div></div></div>`;
 requestAnimationFrame(()=>requestAnimationFrame(()=>{$('#f2').style.strokeDashoffset=C*(1-s/20)}));
 app.onclick=e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.h)home();else if(b.dataset.t){S.p[i]=null;start(i)}}
}
home();
</script></body></html>
